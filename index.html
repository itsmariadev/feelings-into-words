<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=language" />
    <link rel="stylesheet" href="style.css">
    <title>Feelings into words</title>
</head>
<body>
    <div class="language"></div>
    <div class="container">
        <div class="word-container">
            <div class="word"></div>
            <div class="pronunciation"></div>
            <div class="meaning-container">
                <div class="human-meaning"></div>
                <div class="literal-meaning"></div>
            </div>
        </div>
        <button class="literal-meaning-btn">Show Literal Meaning</button>

        <button class="next-word">Next Word</button>
    </div>

    
    <script src="script.js"></script>
</body>
</html>
